name: WoolPortals
version: "0.1.0"
main: com.hakuamatata.woolportals.WoolPortals
api-version: "1.21"
description: Wool-based teleport portals for Hakuna matata
author: HakunaMatata
website: https://github.com/dapize/woolportals

permissions:
  woolportals.use:
    description: Allows using wool portals
    default: true
  woolportals.create:
    description: Allows creating wool portals
    default: true
  woolportals.destroy:
    description: Allows destroying own wool portals
    default: true
  woolportals.admin:
    description: Admin commands for wool portals
    default: op

commands:
  woolportals:
    description: WoolPortals admin commands
    usage: /woolportals <reload|list|info>
    aliases: [wp]
    permission: woolportals.admin
